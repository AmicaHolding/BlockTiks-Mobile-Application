AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BlockTiks MVP backend — Lambda + API Gateway HTTP API + DynamoDB (on-demand)

Parameters:
  StageName:
    Type: String
    Default: dev
  AllowedOrigins:
    Type: String
    Default: '*'
    Description: Comma-separated CORS origins (* for dev only)
  PlatformFeePercent:
    Type: String
    Default: '12'
  ReservationTtlMinutes:
    Type: String
    Default: '15'
    Description: Minutes a pending order holds ticket inventory
  JwtSecret:
    Type: String
    NoEcho: true
    Description: openssl rand -hex 32
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: sk_test_... for sandbox
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: whsec_... from Stripe webhook endpoint

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 20
    Environment:
      Variables:
        TABLE_NAME: !Ref BlockTiksTable
        NODE_ENV: production
        AWS_REGION: !Ref AWS::Region
        CORS_ORIGIN: !Ref AllowedOrigins
        PLATFORM_FEE_PERCENT: !Ref PlatformFeePercent
        RESERVATION_TTL_MINUTES: !Ref ReservationTtlMinutes
        JWT_SECRET: !Ref JwtSecret
        JWT_EXPIRES_IN: 7d
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret

Resources:
  BlockTiksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins: !Split [',', !Ref AllowedOrigins]
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 3600

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ./
      Handler: dist/lambda.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
                - dynamodb:TransactGetItems
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt BlockTiksTable.Arn
                - !Sub '${BlockTiksTable.Arn}/index/*'
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

  # Releases ticket inventory held by abandoned/failed checkouts.
  # Checks Stripe PI status first so a succeeded payment is fulfilled,
  # not released.
  SweeperFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ./
      Handler: dist/sweeper.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
                - dynamodb:TransactGetItems
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt BlockTiksTable.Arn
                - !Sub '${BlockTiksTable.Arn}/index/*'
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)

Outputs:
  ApiUrl:
    Description: Base URL of the deployed API
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
  TableName:
    Value: !Ref BlockTiksTable
