name = "sahra-api"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 database binding. Create once with:
#   npx wrangler d1 create sahra-db
# then paste the database_id below, and apply the schema:
#   npx wrangler d1 execute sahra-db --file schema.sql          (remote)
#   npx wrangler d1 execute sahra-db --local --file schema.sql  (local dev)
[[d1_databases]]
binding = "DB"
database_name = "sahra-db"
database_id = "1a826894-67a9-4086-a3ab-11d0ec3d9f80"

[triggers]
crons = ["*/5 * * * *"]

[vars]
NODE_ENV = "production"
CORS_ORIGIN = "https://sahra-web.pages.dev,https://sahra-studio.pages.dev"
PUBLIC_WEB_URL = "https://sahra-web.pages.dev"
# Secrets go in `wrangler secret put`: JWT_SECRET (set once, persists across deploys), STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, EMAIL_FROM

[alias]
pino = "./src/pino-stub.ts"
