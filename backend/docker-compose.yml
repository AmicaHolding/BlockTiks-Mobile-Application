# Local DynamoDB for offline development, same API as AWS, no account needed.
#   docker compose up -d      (or: npm run db:up)
# Data persists in the named volume until `npm run db:down -- -v`.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    user: root

volumes:
  dynamodb-data:
