name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Apply D1 schema
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 execute sahra-db --remote --file schema.sql
      - name: Deploy Worker
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - { dir: buyer-web, project: sahra-web }
          - { dir: studio, project: sahra-studio }
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app.dir }}/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_STUDIO_URL: ${{ vars.VITE_STUDIO_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
      - name: Deploy to Pages
        if: github.ref == 'refs/heads/main'
        run: npx wrangler pages deploy dist --project-name=${{ matrix.app.project }} --branch=main
